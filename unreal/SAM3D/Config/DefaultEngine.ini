; Minimal engine config. Unreal fills in the rest the first time the project is opened.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Engine.GameModeBase
EditorStartupMap=/Game/Maps/OsaPractice.OsaPractice
GameDefaultMap=/Game/Maps/OsaPractice.OsaPractice

[/Script/Engine.RendererSettings]
; Dynamic lighting only (Lumen GI + reflections, virtual shadow maps) for a large open world.
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Lets tools/ue_remote.py run Python in the open editor (local network only).
bRemoteExecution=True
