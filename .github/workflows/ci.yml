name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simcore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Configure
        run: cmake -S simcore -B simcore/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build simcore/build --config Release
      - name: Test
        run: ctest --test-dir simcore/build -C Release --output-on-failure

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest prototype tools -q
